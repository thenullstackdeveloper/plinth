name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features plinth-application/testing -- -D warnings

      - name: Tests (excludes #[ignore], which require /dev/uinput)
        run: cargo test --workspace --features plinth-application/testing

      - name: Architectural fitness test
        run: ./scripts/fitness.sh
