[workspace]
resolver = "2"
members = [
    "crates/plinth-domain",
    "crates/plinth-application",
    "crates/plinth-infra",
    "crates/plinth-tauri",
]

[workspace.package]
edition = "2021"
version = "0.4.0"
publish = false
license = "PolyForm-Noncommercial-1.0.0"
# See LICENSE.

[workspace.dependencies]
plinth-domain = { path = "crates/plinth-domain" }
plinth-application = { path = "crates/plinth-application" }
plinth-infra = { path = "crates/plinth-infra" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# `default-features = false` drops the HTTP/file `$ref` resolvers, which pull in
# reqwest + rustls + aws-lc-sys. The template schema is embedded with
# `include_str!`, so nothing external is ever resolved - and a community
# template must never be able to trigger a network request during validation.
jsonschema = { version = "0.46", default-features = false }
quick-xml = { version = "0.40", features = ["serialize"] }
dirs = "6"
evdev = "0.13"
tauri = "=2.12.7"
tauri-build = "=2.7.6"
