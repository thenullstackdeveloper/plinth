schema_version: "1"
metadata:
  game: "Star Citizen"
  version: "4.0"
  author: "dev"
pages:
  - components:
      - id: eject
        position: { row: 0, col: 0 }
        action: "v_eject"
        label: "Eject"
      - id: shields
        position: { row: 0, col: 1 }
        action: "v_toggle_shields"
        label: "Shields"
  - components:
      - id: back
        position: { row: 0, col: 0 }
        action: "app.prev_page"
        label: "Back"
sidebar:
  default_side: right
  components:
    - id: lock
      position: { row: 0, col: 0 }
      action: "app.toggle_lock"
      label: "Lock"
