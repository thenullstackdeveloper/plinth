[package]
name = "plinth-infra"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
plinth-domain.workspace = true
plinth-application.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json.workspace = true
serde_yaml_ng.workspace = true
jsonschema.workspace = true
quick-xml.workspace = true
dirs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[dev-dependencies]
plinth-application = { workspace = true, features = ["testing"] }
