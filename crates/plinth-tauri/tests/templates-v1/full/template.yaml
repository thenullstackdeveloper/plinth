# Reference template of format 1.0. It uses every field the format has, so
# it is never edited: a later minor adds a new reference template instead.
schema_version: "1.0"
metadata:
  game: "World of Warcraft"
  version: "reference-full"
  author: "thenullstackdeveloper"
background:
  image: "images/stone.png"
effects:
  page_transition: fade
  press: sink
theme:
  color.panel.background: "#14141c"
  radius.button: "12px"
  motion.page-transition: "200ms"
pages:
  - components:
      - id: fireball
        position: { row: 0, col: 0, row_span: 2, col_span: 2 }
        keys: "1"
        label: "Fireball"
        image: "images/stone.png"
      - id: frost_nova
        position: { row: 0, col: 2 }
        keys: "2"
        label: "Frost nova"
        icon: "images/glow.webp"
        hide_label: true
      - id: cooldown
        position: { row: 1, col: 2 }
        keys: ["shift+1", "3"]
        label: "Cooldown"
        icon: "images/glow.webp"
        style:
          color.button.background: "#7a1f2b"
          color.button.text: "#ffffff"
          color.button.border: "#d08770"
          color.button.pressed-background: "#9a2f3b"
      - id: next
        position: { row: 2, col: 0, col_span: 3 }
        action: "app.next_page"
        label: "More"
  - background:
      image: "images/glow.webp"
    components:
      - { id: world_map, position: { row: 0, col: 0 }, action: "wow.world_map", label: "World map" }
      - { id: bags, position: { row: 0, col: 1 }, keys: "b", label: "Bags" }
      - { id: back, position: { row: 1, col: 0 }, action: "app.go_to_page:0", label: "Back" }
sidebar:
  default_side: left
  components:
    - { id: lock, position: { row: 0, col: 0 }, action: "app.toggle_lock", label: "Lock", icon: "images/glow.webp" }
    - { id: switch_side, position: { row: 1, col: 0 }, action: "app.switch_sidebar", label: "Switch side", icon: "images/glow.webp", hide_label: true }
    - { id: quit, position: { row: 2, col: 0 }, action: "app.quit", label: "Quit" }
